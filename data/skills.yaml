# Canonical skill dictionary — docs/design.md §6 taxonomy. Not exhaustive:
# this is a Phase 1 seed covering the categories with representative real
# entries, not the 250-400 skills the doc expects by month 3. Add entries as
# real postings surface terms this misses.
#
# Schema: id (unique slug), display (UI name), category, aliases (matched
# case-insensitively on word boundaries), patterns (raw regex, used as-is —
# the escape hatch for tokens \b handles badly, like "C++" or where case
# matters, like bare "Go"). Every entry needs at least one alias or pattern.
#
# The `meta` category from §6 (years of experience, degree requirement,
# shipped-title requirement, on-site/hybrid) is deliberately NOT seeded
# here — those are structured facts to extract separately, not skills a
# dictionary pass should match, and that extraction isn't built yet.

