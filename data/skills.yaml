# --- languages ---
# C++, C#, .NET, and Go all need the `patterns` escape hatch rather than
# plain aliases — see §6 and the CompileSkills doc comment. \b doesn't
# reliably bound tokens ending in punctuation (++, #), and bare "go"/"Go"
# collides with the common verb, so it's matched case-sensitively only.
- id: cpp
  display: C++
  category: languages
  patterns: ['(^|[^\w+])C\+\+([^\w+]|$)']
- id: csharp
  display: C#
  category: languages
  patterns: ['(^|[^\w#])C#([^\w#]|$)']
- id: dotnet
  display: .NET
  category: languages
  patterns: ['(^|[^\w.])\.NET([^\w.]|$)']
- id: python
  display: Python
  category: languages
  aliases: ["Python"]
- id: go-lang
  display: Go
  category: languages
  patterns: ['(?-i)\bGo\b']
- id: rust
  display: Rust
  category: languages
  aliases: ["Rust"]
- id: bash
  display: Bash
  category: languages
  aliases: ["Bash", "Shell scripting"]
- id: powershell
  display: PowerShell
  category: languages
  aliases: ["PowerShell"]
- id: typescript
  display: TypeScript
  category: languages
  aliases: ["TypeScript"]
- id: lua
  display: Lua
  category: languages
  aliases: ["Lua"]

