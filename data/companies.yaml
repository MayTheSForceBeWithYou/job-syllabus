# Company registry — docs/design.md §5. Adding a company is a data change,
# never a code change: find its ATS board (open the careers page, watch the
# network tab for the XHR domain), confirm the token below resolves, add an
# entry.
#
# Verified live (HTTP 200, board tokens confirmed, `company_name` field in
# the response cross-checked against the intended company) 2026-08-14 —
# Phase 4 registry expansion. Two tokens ("bethesda", "peak") were dropped
# during verification despite returning HTTP 200 with real postings: they
# were genuine companies (a physical-therapy practice, a mental-health
# app), just not the game studios the same short token also happens to
# name on Greenhouse. Don't add a token on a 200 status alone — check the
# actual company_name/job titles in the response.

- slug: epic-games
  name: Epic Games
  tier: platform
  ats: greenhouse
  token: epicgames
  roleFilters: ["build", "release", "infrastructure", "platform", "devops", "live", "sre", "site reliability", "pipeline", "automation", "tools", "developer experience"]

