# Jenkins Configuration as Code — docs/design.md §10.
#
# This file is the whole point of the exercise: it is cloned from this
# (public) repo at boot by infra/terraform/modules/jenkins/user_data.sh.tftpl
# and is the ONLY source of Jenkins' config. Nothing here is ever set
# through the UI — changes made there don't persist across a rebuild, and
# that's deliberate (docs/design.md §10's DoD: terminate the instance,
# terraform apply, get a fully-configured Jenkins back with no clicking).
#
# Values that can't be hardcoded in a public file (secrets, apply-specific
# resource IDs) come from environment variables user_data writes to
# /etc/jenkins-env, sourced by systemd before Jenkins starts.

jenkins:
  systemMessage: "job-syllabus Jenkins — managed entirely via JCasC (ci/jenkins.yaml). Do not configure through the UI; it will not persist."
  numExecutors: 0 # all work runs on ephemeral Fargate agents — never on the controller
  mode: EXCLUSIVE
  labelString: "controller"

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  clouds:
    - ecs:
        name: "fargate"
        credentialsId: "" # empty = use the controller's own IAM instance profile, no static keys
        cluster: "${ECS_CLUSTER_ARN}"
        regionName: "${AWS_REGION}"
        # NOT the same as unclassified.location.url below (that's the
        # global JenkinsLocationConfiguration) — the ECS cloud has its own
        # jenkinsUrl field, used to build the JNLP agent's connect-back
        # command (`-url <this>`). Left unset, that command element is
        # null, and ECS's RunTask rejects the whole override outright:
        # "InvalidParameterException: Override argument cannot be null."
        # Confirmed against a real boot — every agent launch failed this
        # way regardless of agentContainerName being correctly set.
        jenkinsUrl: "https://jenkins.job-syllabus.skopekreep.com/"
        templates:
          - templateName: "fargate-agent"
            label: "fargate-agent"
            image: "${AGENT_ECR_REPO_URL}:latest"
            # Left unset, the plugin can't name the container in its ECS
            # RunTask override (ContainerOverride.withName(null)), and AWS
            # rejects the call outright: "InvalidParameterException:
            # Override argument cannot be null." Confirmed against a real
            # boot — every agent provisioning attempt failed this way, so
            # no build could ever get an executor. See
            # https://github.com/jenkinsci/amazon-ecs-plugin/issues/319.
            agentContainerName: "jenkins-agent"
            launchType: "FARGATE"
            operatingSystemFamily: "LINUX"
            cpu: "1024"
            memory: "2048"
            networkMode: "awsvpc"
            assignPublicIp: true
            subnets: "${FARGATE_SUBNET_IDS}"
            securityGroups: "${FARGATE_SG_ID}"
            # Field names are executionRole/taskrole (not *Arn) in the
            # amazon-ecs plugin's actual ECSTaskTemplate schema — the *Arn
            # names caused a real JCasC boot failure (UnknownAttributesException)
            # against a live Phase 2 apply; confirmed against the plugin's own
            # reported "Available attributes" list at boot time.
            #
            # executionRole (image pull + logs only) and taskrole (what the
            # running agent can actually call — PowerUserAccess-equivalent,
            # since agents run infra-apply/api-build) are deliberately
            # different roles as of Phase 3 — see modules/jenkins/iam.tf's
            # jenkins_agent role for why reusing the execution role here was
            # a Phase 2 placeholder, not the real design.
            executionRole: "${TASK_EXECUTION_ROLE_ARN}"
            taskrole: "${AGENT_TASK_ROLE_ARN}"
            remoteFSRoot: "/home/jenkins"
            uniqueRemoteFSRoot: true

unclassified:
  location:
    url: "https://jenkins.job-syllabus.skopekreep.com/"

jobs:
  - file: /opt/job-syllabus-ci/ci/jobs.groovy
