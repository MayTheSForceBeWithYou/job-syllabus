services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: job-syllabus-dynamodb-local
    ports:
      - "8000:8000"
    # -inMemory avoids persisting to a mounted volume. It was -sharedDb +
    # -dbPath /data before, but the SQLite backend couldn't open its file on
    # the Windows Docker Desktop volume mount (crash-looped every 3s with
    # "unable to open database file" - see docker logs), which made every
    # request hang until the client's own timeout fired instead of getting a
    # fast error. Local dev doesn't need the data to survive a restart
    # anyway; `make ingest` repopulates it.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  # SQS + S3 for the Phase 4 queue boundary between cmd/ingest and
  # cmd/worker (docs/design.md §9) — named in the Phase 0 plan but not
  # actually needed until the queue architecture existed to test against.
  localstack:
    image: localstack/localstack:3.0.2
    container_name: job-syllabus-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - DEFAULT_REGION=us-west-1
